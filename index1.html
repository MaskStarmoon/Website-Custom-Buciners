<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Katabumb Creator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/phone.css">
</head>
<body>
<aside class="sidebar">
<div class="logo">Kata<span>Bumb</span></div>
<nav class="menu">
<button data-page="dashboard">🏠 Dashboard</button>
<button data-page="theme">🎨 Theme</button>
<button data-page="hero">🖼 Hero</button>
<button data-page="gallery">📷 Gallery</button>
<button data-page="memories">💖 Memories</button>
<button data-page="message">💌 Message</button>
<button data-page="music">🎵 Music</button>
<button data-page="gift">🎁 Gift</button>
<button data-page="button">🔘 Button</button>
<button data-page="animation">✨ Animation</button>
<button data-page="seo">🌐 SEO</button>
<button class="generate" data-page="generate">🚀 Generate</button>
</nav>
</aside>
<main class="app">
<header class="navbar">
<div><h1>Katabumb Creator</h1><p>Website Custom Buciners</p></div>
<div class="status"><span id="saveStatus">Draft tersimpan otomatis</span></div>
</header>
<section class="workspace">
<div class="settings">
<div id="settingPanel"></div>
</div>
<div class="preview-area">
<div class="phone">
<div class="phone-notch"></div>
<div id="phonePreview"></div>
</div>
</div>
</section>
</main>

<div id="toast" class="toast"></div>

<div id="loadingModal" class="modal hidden">
<div class="modal-card">
<h2>Membuat Website...</h2>
<p id="loadingText">Mengirim data ke Katabumb...</p>
<div class="loader"></div>
</div>
</div>

<div id="successModal" class="modal hidden">
<div class="modal-card">
<h2>🎉 Berhasil</h2>
<p>Website berhasil dibuat.</p>
<label>Kode Redeem</label>
<input id="redeemCode" readonly>
<label>Link Website</label>
<input id="websiteURL" readonly>
<div class="modal-actions">
<button id="copyRedeem">Copy Redeem</button>
<button id="copyURL">Copy Link</button>
<button id="openWebsite">Buka Website</button>
<button id="closeSuccess">Tutup</button>
</div>
</div>
</div>

<script src="js/storage.js"></script>
<script src="js/components.js"></script>
<script src="js/render.js"></script>
<script src="js/preview.js"></script>
<script src="js/api.js"></script>
<script src="js/app.js"></script>
</body>
</html>
